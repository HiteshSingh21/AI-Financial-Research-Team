services:
  db:
    image: postgres:15-alpine
    container_name: financial_ai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_ai_pass}
      POSTGRES_DB: financial_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_ai}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: financial_ai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financial_ai}:${POSTGRES_PASSWORD:-financial_ai_pass}@db:5432/financial_ai
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: financial_ai_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
